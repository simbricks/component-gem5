{% set name = "simbricks-gem5-sim-bin" %}

package:
  name: {{ name|lower }}
  version: {{ simbricks_version }}

source:
  path: ../..

build:
  number: 0
  skip: true  # [not linux]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    # SCons: https://github.com/gem5/gem5/issues/2072
    - scons <4.9
    - m4
    - pkg-config
    - python >=3.10
  host:
    - python >=3.10
    - simbricks-lib >=0.4.2      # headers + libsimbricks for the <simbricks/...> build
    - zlib
  run:
    - python >=3.10
    - simbricks-gem5-sim-py =={{ simbricks_version }}   # internal, co-built -> == pin
    - simbricks-lib >=0.4.2

test:
  commands:
    - test -x $PREFIX/opt/gem5/build/X86/gem5.fast

about:
  home: https://www.simbricks.io/
  license: MIT
  summary: gem5 simulator binary with SimBricks support
  dev_url: https://github.com/simbricks/component-gem5

extra:
  recipe-maintainers:
    - Team SimBricks <team@simbricks.io>
